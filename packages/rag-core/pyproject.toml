[project]
name = "hbc-rag-core"
version = "0.1.0"
description = "Hop-bounded agentic RAG pipeline, provider-agnostic."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=2.0",
  "python-dotenv>=1.0",
  "fastembed>=0.4",
  "google-genai>=2.3",
]

[project.scripts]
hbc-rag = "hbc_rag.cli:main"
